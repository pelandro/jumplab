<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Jump Lab · test motore</title>
<style>
body{font:13px/1.45 system-ui,sans-serif;background:#0b0e11;color:#e8eef5;margin:0;padding:18px}
h1{font-size:18px;margin:0 0 4px}p{color:#9fb0c2;max-width:760px}
table{border-collapse:collapse;margin:14px 0;font-variant-numeric:tabular-nums}
th,td{border:1px solid #26323f;padding:5px 9px;text-align:right}th:first-child,td:first-child{text-align:left}
th{background:#16202a}.ok{color:#c6f24e}.bad{color:#ff7b7b}.warn{color:#ffd166}
</style></head><body>
<h1>Test del motore di analisi (dati sintetici)</h1>
<p>Atleta simulato con fisica balistica, rumore dei landmark, buchi e outlier. Verifica la matematica di
rilevamento e misura, <b>non</b> la qualità del modello di postura su video reali.</p>
<div id="out">In esecuzione…</div>
<script type="module">
import { validateJump, flagSeries } from '../js/engine/validate.js';
import { integrate, PRIOR } from '../js/engine/fusion.js';
import { analyze, remeasure, apexEstimate, summarizeSeries, heightFromFlight, samozino, sayersPeakPower, rsiOf } from '../js/engine/jumps.js';
import { detectView, assessRecording } from '../js/engine/quality.js';
import { flowEvents } from '../js/engine/footflow.js';
import { buildScenario, renderTrack, rng } from './sim.js';
import { makeFlowScene, FLOW } from './flowsim.js';

const g = 9.80665;
const rows = [];
const stats = (a) => { if (!a.length) return { mean: NaN, p95: NaN, max: NaN }; const s = [...a].sort((x, y) => x - y); return { mean: a.reduce((x, y) => x + y, 0) / a.length, p95: s[Math.min(s.length - 1, Math.floor(0.95 * (s.length - 1)))], max: s[s.length - 1] }; };

const kinds = ['cmj', 'sj', 'dj', 'rebound'];
const fpsList = [30, 60, 120, 240];
const Ts = [0.35, 0.5, 0.65];
const seeds = [1, 2, 3, 4, 5, 6];
let totalFail = 0;
for (const kind of kinds) for (const fps of fpsList) {
  const errMs = [], errPct = [], cErr = [], dipErr = [], cmFlags = [];
  let expected = 0, found = 0, extra = 0;
  for (const T of Ts) for (const seed of seeds) {
    const scn = buildScenario(kind, { T });
    const track = renderTrack(scn, { fps, seed: seed * 7 + fps, noise: fps <= 60 ? 0.003 : 0.0025 });
    const res = analyze(track, { testType: kind, heightCm: 175 });
    const truth = scn.truth.filter((x) => x.to !== undefined);
    expected += truth.length;
    const contacts = scn.truth.filter((x) => x.contact !== undefined);
    const used = new Set();
    for (const tr of truth) {
      const j = res.jumps.find((jj, idx) => !used.has(idx) && Math.abs(jj.to - tr.to) < 0.15);
      if (!j) continue;
      used.add(res.jumps.indexOf(j)); found++;
      errMs.push(Math.abs(j.T - (tr.td - tr.to)) * 1000);
      const hT = (g * (tr.td - tr.to) ** 2) / 8 * 100;
      errPct.push(Math.abs(j.heightCm - hT) / hT * 100);
      const c = contacts.find((cc) => Math.abs(cc.contactStart + cc.contact - tr.to) < 0.02);
      if (c && j.contact != null) cErr.push(Math.abs(j.contact - c.contact) * 1000);
      if ((kind === 'cmj' || kind === 'sj') && Number.isFinite(j.dipCm)) dipErr.push(Math.abs(j.dipCm - 30));
      if (kind === 'sj') cmFlags.push(j.cmDetected ? 1 : 0);
    }
    extra += res.jumps.length - used.size;
  }
  const e = stats(errMs), p = stats(errPct), c = stats(cErr);
  // soglie attese: errore di 1 frame come riferimento
  const frameMs = 1000 / fps;
  const dp = stats(dipErr);
  const pass = found === expected && extra === 0 && e.mean < Math.max(frameMs * 0.9, 5) && (!dipErr.length || dp.mean < 4);
  if (!pass) totalFail++;
  rows.push({ kind, fps, found: `${found}/${expected}`, extra, eMean: e.mean, eP95: e.p95, pMean: p.mean, pP95: p.p95, cMean: c.mean, cN: cErr.length, dipMean: dp.mean, cmSj: cmFlags.length ? cmFlags.reduce((a, b) => a + b, 0) : null, pass });
}
// Rilevamento di video rallentato: stesso salto con tempi moltiplicati per 4 e 8
const slowRows = [];
for (const s of [1, 2, 4, 8]) {
  const hints = [];
  for (const seed of [1, 2, 3, 4]) {
    const tr = renderTrack(buildScenario('cmj', { T: 0.5 }), { fps: 240, seed, noise: 0.0025 });
    tr.t = tr.t.map((x) => x * s);
    const res = analyze(tr, { testType: 'cmj', heightCm: 175, maxFlight: 12 });
    hints.push(res.jumps[0]?.timeScaleHint ?? 0);
  }
  const ok = s === 1 ? hints.every((x) => x === 0) : hints.every((x) => x === s);
  if (!ok) totalFail++;
  slowRows.push(`<tr><td>rallentato ${s}×</td><td>${hints.join(', ')}</td><td class="${ok ? 'ok' : 'bad'}">${ok ? 'OK' : 'KO'}</td></tr>`);
}
// Deriva del suolo: atleta ripreso di fronte che si avvicina alla camera (i piedi scendono nell'immagine
// di 0,03 altezze-fotogramma tra inizio e fine). Caso reale che la v4.0 iniziale perdeva o misurava male.
const driftRows = [];
for (const fps of [30, 60, 240]) for (const drift of [0.02, 0.04]) {
  const errs = []; let found = 0, tot = 0;
  for (const T of [0.4, 0.55]) for (const seed of [1, 2, 3]) {
    const scn = buildScenario('cmj', { T });
    const tr = renderTrack(scn, { fps, seed: seed * 11 + fps, noise: fps <= 60 ? 0.003 : 0.0025 });
    const t0 = tr.t[0], span = tr.t[tr.t.length - 1] - t0;
    tr.kp = tr.kp.map((k, i) => { if (!k) return k; const o = Float32Array.from(k); const dy = drift * (tr.t[i] - t0) / span; for (let q = 0; q < 33; q++) o[q * 3 + 1] += dy; return o; });
    const res = analyze(tr, { testType: 'cmj', heightCm: 175 });
    const truth = scn.truth.filter((x) => x.to !== undefined); tot += truth.length;
    for (const x of truth) { const j = res.jumps.find((jj) => Math.abs(jj.to - x.to) < 0.15); if (j) { found++; errs.push(Math.abs(j.T - (x.td - x.to)) * 1000); } }
  }
  const mean = errs.length ? errs.reduce((a, b) => a + b, 0) / errs.length : NaN;
  const ok = found === tot && mean < Math.max(1000 / fps * 0.9, 5);
  if (!ok) totalFail++;
  driftRows.push(`<tr><td>deriva ${drift}</td><td>${fps}</td><td>${found}/${tot}</td><td>${Number.isFinite(mean) ? mean.toFixed(1) : '—'}</td><td class="${ok ? 'ok' : 'bad'}">${ok ? 'OK' : 'KO'}</td></tr>`);
}
// Robustezza: difetti realistici dei landmark vicino a stacco e atterraggio (CMJ).
const FEET = [27, 28, 29, 30, 31, 32];
const perturbs = {
  'rumore e valori anomali ai contatti': (tr, truth, r) => {
    const dt = (tr.t[tr.t.length - 1] - tr.t[0]) / (tr.t.length - 1);
    tr.kp.forEach((k, i) => { if (!k) return; const near = truth.some((x) => Math.abs(tr.t[i] - x.to) < 4 * dt || Math.abs(tr.t[i] - x.td) < 4 * dt); if (!near) return;
      for (const q of FEET) { k[q * 3 + 1] += r.gauss() * 0.008; if (r.u() < 0.2) k[q * 3 + 1] += (r.u() - 0.5) * 0.08; } });
  },
  'piedi non rilevati dopo l\'atterraggio': (tr, truth) => {
    const dt = (tr.t[tr.t.length - 1] - tr.t[0]) / (tr.t.length - 1);
    tr.kp.forEach((k, i) => { if (!k) return; if (truth.some((x) => tr.t[i] >= x.td && tr.t[i] < x.td + 3.5 * dt)) for (const q of FEET) k[q * 3 + 2] = 0.05; });
  },
  'piedi che scivolano dopo l\'atterraggio': (tr, truth) => {
    tr.kp.forEach((k, i) => { if (!k) return; for (const x of truth) { const d = tr.t[i] - x.td; if (d > 0) { const dy = 0.02 * Math.min(1, d / 0.15); for (const q of FEET) k[q * 3 + 1] += dy; } } });
  },
  'camera che trema (3 Hz)': (tr) => {
    tr.kp.forEach((k, i) => { if (!k) return; const dy = 0.006 * Math.sin(2 * Math.PI * 3 * tr.t[i]); for (let q = 0; q < 33; q++) k[q * 3 + 1] += dy; });
  },
  'ritardo del modello sui piedi (1 fotogramma)': (tr) => {
    const src = tr.kp.map((k) => (k ? Float32Array.from(k) : k));
    tr.kp.forEach((k, i) => { if (!k || !src[i - 1]) return; for (const q of FEET) k[q * 3 + 1] = src[i - 1][q * 3 + 1]; });
  },
};
const robRows = [];
for (const [name, fn] of Object.entries(perturbs)) for (const fps of [30, 60, 240]) {
  const errs = []; let found = 0, tot = 0, extra = 0;
  for (const T of [0.4, 0.55]) for (const seed of [1, 2, 3, 4]) {
    const scn = buildScenario('cmj', { T });
    const tr = renderTrack(scn, { fps, seed: seed * 13 + fps, noise: fps <= 60 ? 0.003 : 0.0025 });
    const truth = scn.truth.filter((x) => x.to !== undefined);
    fn(tr, truth, rng(seed * 101 + fps));
    const res = analyze(tr, { testType: 'cmj', heightCm: 175 });
    tot += truth.length; const used = new Set();
    for (const x of truth) { const j = res.jumps.find((jj, ix) => !used.has(ix) && Math.abs(jj.to - x.to) < 0.15); if (j) { used.add(res.jumps.indexOf(j)); found++; errs.push(Math.abs(j.T - (x.td - x.to)) * 1000); } }
    extra += res.jumps.length - used.size;
  }
  const mean = errs.length ? errs.reduce((a, b) => a + b, 0) / errs.length : NaN;
  const ok = found === tot && extra === 0 && mean < Math.max(1000 / fps * 1.5, name.startsWith('camera') ? 10 : 8);
  if (!ok) totalFail++;
  robRows.push(`<tr><td>${name}</td><td>${fps}</td><td>${found}/${tot}</td><td>${extra}</td><td>${Number.isFinite(mean) ? mean.toFixed(1) : '—'}</td><td class="${ok ? 'ok' : 'bad'}">${ok ? 'OK' : 'KO'}</td></tr>`);
}

// ---- Formule con valori noti (calcolati a mano) ----
const fRows = [];
const chk = (name, got, want, tol, unit = '') => { const ok = Math.abs(got - want) <= tol; if (!ok) totalFail++; fRows.push(`<tr><td>${name}</td><td>${got.toFixed(3)} ${unit}</td><td>${want} ${unit}</td><td class="${ok ? 'ok' : 'bad'}">${ok ? 'OK' : 'KO'}</td></tr>`); };
chk('h da volo 0,500 s', heightFromFlight(0.5) * 100, 30.646, 0.01, 'cm');
chk('h da volo 0,6 s', heightFromFlight(0.6) * 100, 44.130, 0.01, 'cm');
{ const z = samozino(75, 0.40, 0.40); chk('Samozino F (75 kg, h 0,40, hpo 0,40)', z.F, 1471.0, 0.5, 'N'); chk('Samozino v media', z.v, 1.4005, 0.001, 'm/s'); chk('Samozino P', z.P, 2060.2, 1, 'W'); }
{ const z = samozino(80, 0.30, 0.35); chk('Samozino F (80 kg, h 0,30, hpo 0,35)', z.F, 1457.4, 0.5, 'N'); }
chk('Sayers (40 cm, 75 kg)', sayersPeakPower(40, 75), 3770.5, 0.01, 'W');
chk('RSI (0,35 m / 0,20 s)', rsiOf(0.35, 0.2), 1.75, 1e-9);
{ const s = summarizeSeries([30, 32, 31, 29, 27, 25].map((h) => ({ heightCm: h, contact: 0.2, rsi: h / 100 / 0.2 }))); chk('Serie: media', s.meanCm, 29, 1e-9, 'cm'); chk('Serie: calo primo vs ultimo terzo', s.declinePct, 16.13, 0.02, '%'); chk('Serie: CV', s.cvPct, 8.99, 0.02, '%'); }

// ---- Altezza da velocità di stacco (apice del bacino): deve concordare con quella da tempo di volo su un salto fisico ----
for (const fps of [60, 120, 240]) {
  const r = [], asy = []; let miss = 0;
  for (const T of [0.4, 0.55, 0.65]) for (const seed of [1, 2, 3, 4]) {
    const scn = buildScenario('cmj', { T });
    const track = renderTrack(scn, { fps, seed: seed * 11 + fps, noise: 0.0025 });
    const res = analyze(track, { testType: 'cmj', heightCm: 175 });
    const j = res.jumps[0];
    if (!j || !Number.isFinite(j.apexCm)) { miss++; continue; }
    r.push(j.apexCm / j.heightCm); asy.push(Math.abs(j.apexAsymMs));
  }
  const m = r.length ? r.reduce((a, b) => a + b, 0) / r.length : NaN, am = asy.length ? asy.reduce((a, b) => a + b, 0) / asy.length : NaN;
  chk(`Altezza da apice / da volo (CMJ ${fps} fps, ${r.length}/12 salti)`, m, 1, 0.08);
  chk(`Asimmetria dell'apice (CMJ ${fps} fps)`, am, 0, 25, 'ms');
  if (miss > 2) { totalFail++; fRows.push(`<tr><td>Apice assente in ${miss} salti su 12 (${fps} fps)</td><td></td><td></td><td class="bad">KO</td></tr>`); }
}

// ---- Altezza da velocità di stacco con braccia che oscillano: il baricentro a corpo intero ha verità nota ----
// Braccia da "giù" a orizzontali/alte allo stacco e di nuovo giù in volo; il baricentro dell'intero corpo (de Leva) resta balistico,
// mentre tronco e anche si spostano in senso opposto: il solo tronco/bacino sovrastima, il corpo intero no.
for (const [lab, up] of [['braccia orizzontali → giù', Math.PI / 2], ['braccia in alto → giù', 0.25 * Math.PI]]) {
  for (const fps of [60, 240]) {
    const eFull = [], eTr = []; let proxyOk = 0, n = 0;
    for (const seed of [1, 2, 3, 4, 5, 6]) {
      const scn = buildScenario('cmj', { T: 0.5 });
      const tr = scn.truth.find((x) => x.to !== undefined);
      const res = analyze(renderTrack(scn, { fps, seed: seed * 7 + fps, noise: 0.0025, arms: { up } }), { testType: 'cmj', heightCm: 175 });
      if (!res.sig) continue;
      const hT = (g * (tr.td - tr.to) ** 2) / 8 * 100;
      const j = remeasure(res, tr.to, tr.td, { heightCm: 175, uncT: 0.004 });
      const j2 = remeasure({ ...res, sig: { ...res.sig, limb: null } }, tr.to, tr.td, { heightCm: 175, uncT: 0.004 });
      n++; if (j.apexProxy === 'corpo intero') proxyOk++;
      eFull.push(j.apexCm - hT); eTr.push(j2.apexCm - hT);
    }
    const mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    chk(`Culmine, ${lab}, ${fps} fps: errore del corpo intero`, mean(eFull.map(Math.abs)), 0, 1.0, 'cm');
    chk(`Culmine, ${lab}, ${fps} fps: il solo tronco/bacino sovrastima (≥ 1,5 cm)`, Math.min(mean(eTr), 1.5), 1.5, 0.001, 'cm');
    chk(`Culmine, ${lab}, ${fps} fps: baricentro «corpo intero» usato (${n} salti)`, proxyOk, n, 0);
  }
}

// ---- Calibrazione dell'incertezza dell'altezza da velocità di stacco (Monte Carlo, proxy con rumore e deriva, eventi con errore) ----
{
  const rr = rng(2024);
  for (const fps of [30, 120, 240]) {
    const dt = 1 / fps; let cover2 = 0, nOk = 0, sumErr = 0, sumAbs = 0;
    for (let q = 0; q < 200; q++) {
      const delta = 0.06, v0 = 2.6 + rr.u() * 0.9, to = 1 + rr.u() * dt, T = (v0 + Math.sqrt(v0 * v0 + 2 * g * delta)) / g, td = to + T;
      const t = Array.from({ length: Math.floor((T + 1.2) / dt) }, (_, i) => to - 0.6 + i * dt);
      const y = (tt) => (tt < to ? 0 : tt > td ? -delta : v0 * (tt - to) - 0.5 * g * (tt - to) ** 2);
      const mk = (b) => Float64Array.from(t, (tt) => y(tt) + (tt >= to && tt <= td ? b * ((tt - to) / T - 0.5) : 0) + rr.gauss() * 0.01);
      const e = apexEstimate({ t, dt, to: to + rr.gauss() * 0.004, td: td + rr.gauss() * 0.004, uncT: 0.0057, series: [{ name: 'corpo intero', sm: mk(0) }, { name: 'tronco', sm: mk(0.02) }, { name: 'bacino', sm: mk(-0.03) }] });
      if (!e) continue;
      const err = e.cm - (v0 * v0 / (2 * g)) * 100; nOk++; sumErr += err; sumAbs += Math.abs(err); if (Math.abs(err) <= 2 * e.uncCm) cover2++;
    }
    chk(`Apice (Monte Carlo, ${fps} fps): errore medio (bias, ${nOk} prove)`, sumErr / nOk, 0, 0.4, 'cm');
    chk(`Apice (Monte Carlo, ${fps} fps): errore assoluto medio`, sumAbs / nOk, 1.0, 0.5, 'cm');
    chk(`Apice (Monte Carlo, ${fps} fps): copertura dell'incertezza a 2σ (≥ 90 %)`, Math.min(100 * cover2 / nOk, 95), 95, 5, '%');
  }
}

// ---- Validazione ibrida dei tre metodi (volo / baricentro nello spazio / parabola) ----
{
  const base = () => ({ T: 0.6, dt: 1 / 240, fps: 240, heightCm: 44, uncCm: 1, uncT: 0.006, apexCm: 40, apexUncCm: 1.5, apexAsymMs: -15, apexT: 0.28, apexSigTa: 0.004, apexProxy: 'corpo intero', apexSpreadCm: 1, apexRmseRel: 0.003, geoCm: 41, geoUncCm: 4, flow: { pixelBoth: true, src: { to: 'pixel', td: 'pixel' } }, score: 0.9, issues: [] });
  const st = (j) => validateJump(j).verdict;
  const mid = (j, id) => j.methods.find((m) => m.id === id);
  const ck = (name, ok) => { if (!ok) totalFail++; fRows.push(`<tr><td>${name}</td><td></td><td></td><td class="${ok ? 'ok' : 'bad'}">${ok ? 'OK' : 'KO'}</td></tr>`); };
  { const j = validateJump(base()); ck('Validazione: salto coerente → «coerenti», consigliata la stima integrata, nessun avviso', j.verdict.status === 'coerenti' && j.verdict.recommended === 'integrato' && !j.issues.some((x) => x.code.startsWith('val_'))); ck('Validazione: pixel a 240 fps → volo «alta»; corpo intero → parabola «alta»', mid(j, 'volo').level === 'alta' && mid(j, 'parabola').level === 'alta'); }
  { const j = base(); j.apexCm = 50; ck('Validazione: parabola più alta del volo → incoerente, nessun metodo consigliato', st(j).status === 'incoerenti' && st(j).recommended === null); }
  { const j = base(); j.apexCm = 31; ck('Validazione: deficit del 30 % → incoerente', st(j).status === 'incoerenti'); }
  { const j = base(); j.apexAsymMs = -55; ck('Validazione: culmine a −55 ms da metà volo → istanti sospetti', st(j).flags.some((f) => f.code === 'asimmetria') && st(j).status === 'incoerenti'); }
  { const j = base(); j.staticDeltaM = 0.10; j.apexAsymMs = -(0.01 / (g * 0.6)) * 1000; st(j); const j2 = base(); j2.staticDeltaM = 0.01; j2.apexAsymMs = -(0.01 / (g * 0.6)) * 1000; st(j2); ck('Validazione: misure di Δ che divergono (traiettoria 1 cm, statica 10 cm) → livello della stima integrata abbassato con motivo; concordi → nessun motivo', mid(j, 'integrato').contro.some((t) => /divergono/.test(t)) && !mid(j2, 'integrato').contro.some((t) => /divergono/.test(t)) && mid(j, 'integrato').score < mid(j2, 'integrato').score); }
  { const j = base(); j.geoCm = 58; const v = st(j); ck('Validazione: scala incoerente → «parziale», flag scala, i metodi sul tempo restano', v.status === 'parziale' && v.flags.some((f) => f.code === 'scala') && v.recommended === 'integrato' && mid(j, 'baricentro').level !== 'alta'); }
  { const j = base(); j.apexCm = NaN; j.apexT = NaN; j.geoCm = NaN; const v = st(j); ck('Validazione: baricentro non adattabile → solo volo, dichiarato', v.status === 'parziale' && v.flags.some((f) => f.code === 'solo_volo') && mid(j, 'parabola').nonDisponibile); }
  { const j = base(); j.flow = null; const v = st(j); ck('Validazione: istanti dai landmark a 240 fps → volo e parabola non «alta»', mid(j, 'volo').level !== 'alta' && mid(j, 'parabola').level !== 'alta'); }
  { const j = base(); j.flow = { pixelBoth: false, src: { to: 'pixel', td: 'landmark' } }; st(j); ck('Validazione: stacco dai pixel, atterraggio dai landmark → il volo perde, la parabola no', mid(j, 'volo').score < mid(j, 'parabola').score); }
  { const j = base(); j.manual = true; j.flow = null; st(j); ck('Validazione: istanti manuali → motivo «scelti a mano», nessuna penalità di fonte', mid(j, 'volo').pro.some((t) => /a mano/.test(t)) && mid(j, 'volo').level === 'alta'); }
  { const j = base(); j.scaleAssumed = true; st(j); ck('Validazione: altezza dell\'atleta non impostata → metodo spaziale penalizzato con motivo', mid(j, 'baricentro').contro.some((t) => /scala presunta/.test(t)) && mid(j, 'baricentro').level !== 'alta'); }
  { const j = base(); validateJump(j); const s1 = j.score, n1 = j.issues.length; validateJump(j); validateJump(j); ck('Validazione: idempotente (punteggio e avvisi non si accumulano)', Math.abs(j.score - s1) < 1e-12 && j.issues.length === n1); }
  { const j = base(); j.apexCm = 50; validateJump(j); const bad = j.score; j.apexCm = 40; validateJump(j); ck('Validazione: la penalità sparisce quando il salto torna coerente', j.score > bad && !j.issues.some((x) => x.code.startsWith('val_'))); }
  { const mk = (hs) => hs.map((h) => ({ heightCm: h, issues: [] })); const a = mk([40, 41, 39, 40, 42, 12]); flagSeries(a); const b = mk([40, 41, 39, 40]); flagSeries(b); const c = mk([30, 32, 31, 29, 33, 31]); flagSeries(c);
    ck('Serie: salto anomalo (12 cm tra salti da 40) segnalato, gli altri no; serie normale e serie corta intatte', !!a[5].seriesOutlier && !a.slice(0, 5).some((x) => x.seriesOutlier) && !b.some((x) => x.seriesOutlier) && !c.some((x) => x.seriesOutlier)); }
}

// ---- Errori iniettati su un salto sintetico (verità nota): cosa individua la validazione e cosa no ----
{
  const ck = (name, ok) => { if (!ok) totalFail++; fRows.push(`<tr><td>${name}</td><td></td><td></td><td class="${ok ? 'ok' : 'bad'}">${ok ? 'OK' : 'KO'}</td></tr>`); };

  rows.map((r) => `<tr><td>${r.kind}</td><td>${r.fps}</td><td>${r.found}</td><td>${r.extra}</td><td>${f(r.eMean)}</td><td>${f(r.eP95)}</td><td>${f(r.pMean)}</td><td>${f(r.pP95)}</td><td>${f(r.cMean)} (n=${r.cN})</td><td>${f(r.dipMean)}</td><td>${r.cmSj ?? '—'}</td><td class="${r.pass ? 'ok' : 'bad'}">${r.pass ? 'OK' : 'KO'}</td></tr>`).join('') +
  `</table><h2 style="font-size:15px">Controllo di coerenza con la gravità (suggerimento di calibrazione)</h2><table><tr><th>Scenario</th><th>Suggerimento (4 prove)</th><th>Esito</th></tr>${slowRows.join('')}</table><h2 style="font-size:15px">Deriva del suolo (atleta che si avvicina alla camera)</h2><table><tr><th>Scenario</th><th>fps</th><th>Voli trovati</th><th>Err. T medio (ms)</th><th>Esito</th></tr>${driftRows.join('')}</table><h2 style="font-size:15px">Robustezza ai difetti dei landmark</h2><table><tr><th>Difetto</th><th>fps</th><th>Voli trovati</th><th>Falsi</th><th>Err. T medio (ms)</th><th>Esito</th></tr>${robRows.join('')}</table><h2 style="font-size:15px">Formule con valori noti</h2><table><tr><th>Formula</th><th>Calcolato</th><th>Atteso</th><th>Esito</th></tr>${fRows.join('')}</table><h2 style="font-size:15px">Riconoscimento dell'inquadratura</h2><table><tr><th>Scenario</th><th>Rapporto spalle/busto</th><th>Riconosciuta</th><th>Esito</th></tr>${vRows.join('')}</table><h2 style="font-size:15px">Controllo qualità della ripresa</h2><table><tr><th>Caso</th><th>Esito</th></tr>${qRows.join('')}</table><h2 style="font-size:15px">Suolo diverso e salto su una gamba</h2><table><tr><th>Scenario</th><th>fps</th><th>Voli trovati</th><th>Err. T medio (ms)</th><th>Esito</th></tr>${gRows.join('')}</table><h2 style="font-size:15px">Eventi dai pixel del piede (verità nota)</h2><table><tr><th>Scenario</th><th>Eventi trovati</th><th>Err. stacco (ms)</th><th>Err. atterr. (ms)</th><th>1 fotogramma (ms)</th><th>Esito</th></tr>${flowRows.join('')}</table><p class="${totalFail ? 'bad' : 'ok'}">${totalFail ? totalFail + ' scenari fuori soglia' : 'Tutti gli scenari entro soglia'}</p>`;
window.__results = { rows, totalFail };
</script></body></html>
