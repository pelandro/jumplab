<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Jump Lab · test pipeline</title>
<style>body{font:13px/1.5 system-ui;background:#0b0e11;color:#e8eef5;padding:18px}pre{background:#121920;padding:12px;border-radius:8px;overflow:auto}.ok{color:#c6f24e}.bad{color:#ff7b7b}</style></head>
<body><h1>Pipeline end-to-end con modello di postura simulato</h1>
<p>Video MP4 sintetico (marcatori colorati) → demux + WebCodecs → due passate → analisi. Il "modello" legge i
marcatori dai pixel: verifica decodifica, timestamp, ritaglio, finestre e mappatura coordinate (non la rete neurale).</p>
<pre id="out">In esecuzione…</pre>
<script type="module">
import { pose } from '../js/engine/pose.js';
import { runAnalysis } from '../js/engine/pipeline.js';

const COLORS = { toe: [255, 0, 0], heel: [0, 255, 0], hip: [0, 0, 255], sh: [255, 255, 0], nose: [255, 0, 255], knee: [0, 255, 255], ank: [255, 128, 0] };
const LMS = { toe: [31, 32], heel: [29, 30], hip: [23, 24], sh: [11, 12], nose: [0], knee: [25, 26], ank: [27, 28] };
pose.init = async () => ({ model: 'mock', delegate: 'none' });
pose.detect = (canvas) => {
  const ctx = canvas.getContext('2d');
  const { width: w, height: h } = canvas;
  const d = ctx.getImageData(0, 0, w, h).data;
  const acc = {};
  for (const k in COLORS) acc[k] = [0, 0, 0];
  for (let i = 0; i < d.length; i += 4) {
    for (const k in COLORS) {
      const c = COLORS[k];
      if (Math.abs(d[i] - c[0]) + Math.abs(d[i + 1] - c[1]) + Math.abs(d[i + 2] - c[2]) < 110) {
        const p = i / 4; acc[k][0] += p % w; acc[k][1] += Math.floor(p / w); acc[k][2]++;
      }
    }
  }
  const kp = new Float32Array(99);
  let ok = 0;
  for (const k in COLORS) {
    const a = acc[k];
    if (a[2] < 4) continue;
    ok++;
    for (const i of LMS[k]) { kp[i * 3] = a[0] / a[2] / w; kp[i * 3 + 1] = a[1] / a[2] / h; kp[i * 3 + 2] = 0.95; }
  }
  return ok >= 5 ? kp : null;
};

const g = 9.80665, lines = [];
for (const name of ['cmj240', 'cmj60']) {
  const buf = await (await fetch(`./fixtures/${name}.mp4`)).blob();
  const truth = await (await fetch(`./fixtures/${name}.json`)).json();
  const file = new File([buf], name + '.mp4', { type: 'video/mp4' });
  const t0 = performance.now();
  const stages = [];
  const session = await runAnalysis(file, { testType: 'cmj', heightCm: 175, model: 'mock' }, {
    onStage: (s) => { if (!stages.includes(s)) stages.push(s); },
    onLog: (s) => lines.push('  log: ' + s),
  });
  const ms = performance.now() - t0;
  lines.push(`${name}: ${session.meta.kind} ${session.meta.width}x${session.meta.height} ${session.meta.fps.toFixed(1)}fps ${session.meta.frameCount} frame · ${ms.toFixed(0)} ms · stadi ${stages.join('>')}`);
  lines.push(`  finestre: ${session.windows.map((w) => `${w.t0.toFixed(2)}-${w.t1.toFixed(2)}s (${w.frames.length} frame, crop ${w.crop.w.toFixed(2)}x${w.crop.h.toFixed(2)})`).join(' | ')}`);
  const j = session.jumps?.[0];
  if (!j) { lines.push('  NESSUN SALTO: ' + (session.error || session.noCoarseJump)); continue; }
  const eT = Math.abs(j.T - truth.T) * 1000, eTo = (j.to - truth.to) * 1000, eTd = (j.td - truth.td) * 1000;
  const hTrue = (g * truth.T ** 2) / 8 * 100;
  lines.push(`  stacco ${j.to.toFixed(4)} (err ${eTo.toFixed(1)} ms) · atterraggio ${j.td.toFixed(4)} (err ${eTd.toFixed(1)} ms) · T ${j.T.toFixed(4)} (err ${eT.toFixed(1)} ms)`);
  lines.push(`  altezza ${j.heightCm.toFixed(1)} cm (vero ${hTrue.toFixed(1)}) · dip ${j.dipCm.toFixed(1)} cm · conf ${j.confidence} (${j.issues.map((i) => i.code).join(',') || '—'})`);
  const okk = eT < 8 && session.meta.kind === 'webcodecs';
  lines.push(`  <span class="${okk ? 'ok' : 'bad'}">${okk ? 'OK' : 'FUORI SOGLIA'}</span>`);
}
document.getElementById('out').innerHTML = lines.join('\n');
window.__done = true;
</script></body></html>
